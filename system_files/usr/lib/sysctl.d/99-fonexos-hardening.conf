# FonexOS hardening sysctls
# Bake into image at: /usr/lib/sysctl.d/99-fonexos-hardening.conf
# (use /usr/lib, not /etc — /etc is user-writable and won't survive
#  the "immutable /usr" model consistently; /usr/lib/sysctl.d is the
#  correct baked-in location and still gets overridden by anything an
#  admin later drops in /etc/sysctl.d if you ever want that escape hatch)

# --- Kernel pointer / info leak hardening ---
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.printk = 3 3 3 3

# --- ptrace restriction (blocks most process-injection/credential-scraping) ---
kernel.yama.ptrace_scope = 2

# --- BPF hardening ---
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# --- Disable unprivileged user namespaces for non-container use paths ---
# NOTE: test this carefully — Flatpak/Toolbox/Podman rely on user namespaces.
# secureblue keeps this enabled but sandboxes with SELinux + seccomp instead.
# Leave commented unless you've confirmed Flatpak still works:
# user.max_user_namespaces = 0

# --- Core dumps off (avoid leaking sensitive memory to disk) ---
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0

# --- Network stack hardening ---
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0

# --- ASLR: max entropy ---
kernel.randomize_va_space = 2

# --- Misc ---
kernel.sysrq = 0
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
